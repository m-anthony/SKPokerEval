plugins {
    id("com.diffplug.spotless") version "8.1.0"
}

allprojects {
	group 'io.github.kennethshackleton.skpokereval'
	version '1.10.0-SNAPSHOT'
	
	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'

	java {
		sourceCompatibility = '17'
		targetCompatibility = '17'
	}
    spotless {
        java {
            palantirJavaFormat()
        }
    }

    tasks.named('check') {
        dependsOn spotlessCheck
    }
}

